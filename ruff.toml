# Ruff configuration for the AgentForge platform code.
# Kept strict-but-pragmatic; the domain/contract layers must stay framework-neutral.
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[lint.per-file-ignores]
# Operational red-team / live-campaign scripts embed long adversarial PAYLOAD STRINGS and verbose
# banner comments; wrapping a payload literal at 100 cols is noise (and risks altering the payload).
# Library code (src/) and tests stay strict — this relaxation is scoped to scripts/ only.
"scripts/*" = ["E501", "E741"]

[lint.isort]
known-first-party = ["agentforge"]

[format]
quote-style = "double"
